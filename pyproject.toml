[project]
name = "erpnext_eingangsrechnung"
authors = [
    { name = "AffiKSys", email = "m.heide@affiksys.com" }
]
description = "Liest Eingangsrechnungen (PDF, ZUGFeRD/Factur-X) aus einem Ordner, benennt sie einheitlich um und legt Entwürfe von Eingangsrechnungen in ERPNext an. Alles lokal, ohne Cloud-Dienste."
requires-python = ">=3.10"
readme = "README.md"
dynamic = ["version"]
dependencies = []

[build-system]
requires = ["flit_core >=3.4,<4"]
build-backend = "flit_core.buildapi"

[tool.bench.frappe-dependencies]
frappe = ">=15.0.0,<17.0.0"
